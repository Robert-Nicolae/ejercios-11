name: Ejecución de script
on:
  push:
    branches: [ main ]

jobs:
  ejecutar_script:
    runs-on: ubuntu-24.04
    steps:
    - name: descargar repositorio
      uses: actions/checkout@v5
      
    - name: muestra usuario
      run: 
        whoami
        
    - name: permisos script
      run: |
        pwd
        ls -l
        chmod +x src/hola.sh
       
    - name: ejectuta script
      run: 
        ./src/hola.sh

   - name: Ejecutar script
      run: ./src/hola.sh

   - name: Crear carpeta backup
      run: mkdir -p backup

   - name: Comprimir carpeta datos
     run: tar -czvf backup/datos.tar.gz datos/
 
   - name: Subir copia de seguridad
      uses: actions/upload-artifact@v4
    with:
      name: copia-seguridad
        path: backup/datos.tar.gz

